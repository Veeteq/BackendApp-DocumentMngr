#spring.profiles.active=default

spring.application.name=document-mngr

spring.datasource.testWhileIdle=true
spring.datasource.validationQuery=SELECT 1

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.enabled=true

# Hibernate ddl auto (create, create-drop, validate, update)

addressbook.api.url=http://localhost:8181/api

open.api.spec.url=https://veeteq.github.io/OpenAPI-DocumentMngr/openapi.yaml
#open.api.spec.url=http://localhost:8181/openapi.json

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

logging.level.org.zalando.logbook.Logbook=TRACE